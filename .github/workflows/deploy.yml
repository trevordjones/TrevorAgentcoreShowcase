name: CI / Deploy Dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Unit/contract tests run on every push and PR.
# Secret sync + deploy only run on push to main.

jobs:
  # ── 1. Tests (all events) ─────────────────────────────────────────────────
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Run SqlAssistant tests
        working-directory: app/SqlAssistant
        run: uv run pytest tests/ -v

      - name: Run SchemaAssistant tests
        working-directory: app/SchemaAssistant
        run: uv run pytest tests/ -v

  # ── 2. Secrets → Deploy (push to main only) ──────────────────────────────
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC → AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SOPS
        run: |
          curl -fsSL -o sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          install -m 755 sops /usr/local/bin/sops

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      # Decrypt the SOPS-encrypted secrets and expose them to subsequent steps.
      # The KMS key grants access via the IAM role — no plaintext secrets stored in GitHub.
      - name: Decrypt secrets
        run: |
          sops -d --output-type json agentcore/secrets/dev.enc.yaml > /tmp/secrets.json
          echo "LITELLM_API_KEY=$(jq -r .LITELLM_API_KEY /tmp/secrets.json)" >> $GITHUB_ENV
          echo "LITELLM_BASE_URL=$(jq -r .LITELLM_BASE_URL /tmp/secrets.json)" >> $GITHUB_ENV

      # Sync secrets to Secrets Manager so the deployed agents can read them at runtime.
      - name: Sync secrets to AWS Secrets Manager
        run: |
          SECRET_ID="TrevorShowcase/SqlAssistant/litellm"
          SECRET_VALUE=$(cat /tmp/secrets.json)
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region us-east-2 \
              --query "ARN" --output text 2>/dev/null; then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ID" \
              --secret-string "$SECRET_VALUE" \
              --region us-east-2
            echo "Updated existing secret: $SECRET_ID"
          else
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --secret-string "$SECRET_VALUE" \
              --region us-east-2
            echo "Created new secret: $SECRET_ID"
          fi

      - name: Install CDK dependencies
        working-directory: agentcore/cdk
        run: npm ci

      - name: Build CDK project
        working-directory: agentcore/cdk
        run: npm run build

      - name: Test CDK synth (debug)
        working-directory: agentcore/cdk
        run: node dist/bin/cdk.js 2>&1 || true

      - name: Install agentcore CLI
        run: npm install -g @aws/agentcore

      - name: Deploy both agents to dev
        run: agentcore deploy --target default --yes

  # ── 3. Promote to staging (git tag only) ─────────────────────────────────
  promote-to-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    environment: staging   # requires manual approval in GitHub repo settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STG }}
          aws-region: us-east-2

      - name: Install agentcore CLI
        run: npm install -g @aws/agentcore

      - name: Deploy both agents to staging
        run: agentcore deploy --target default --yes
